name: Redis Outage Qualification

on:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "tests/parity/redis_outage.py"
      - ".github/workflows/redis-outage.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/parity/redis_outage.py"
      - ".github/workflows/redis-outage.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  outage:
    name: Real Redis pause, outage and recovery
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Restore and build candidate
        run: |
          dotnet restore RequestGuardMcp.slnx --locked-mode
          dotnet build RequestGuardMcp.slnx --configuration Release --no-restore --warnaserror
      - name: Qualify candidate against a real Redis backend
        run: python3 tests/parity/redis_outage.py --dotnet-dll src/RequestGuardMcp.Host/bin/Release/net10.0/request-guard-mcp-dotnet.dll
      - name: Check out pre-cache-bound negative control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: c028cdbf9408aac66d43db27b0eede3c4ab3fcc6
          path: negative-control
      - name: Build negative control from its locked dependencies
        run: |
          dotnet restore negative-control/RequestGuardMcp.slnx --locked-mode
          dotnet build negative-control/RequestGuardMcp.slnx --configuration Release --no-restore --warnaserror
      - name: Require healthy preflight and recovery but failed paused classification in old build
        run: python3 tests/parity/redis_outage.py --dotnet-dll negative-control/src/RequestGuardMcp.Host/bin/Release/net10.0/request-guard-mcp-dotnet.dll --expect-paused-failure
