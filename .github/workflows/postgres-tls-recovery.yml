name: PostgreSQL TLS and Recovery Qualification

on:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "tests/parity/postgres_tls_recovery.py"
      - "tests/parity/run.py"
      - ".github/workflows/postgres-tls-recovery.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/parity/postgres_tls_recovery.py"
      - "tests/parity/run.py"
      - ".github/workflows/postgres-tls-recovery.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    name: VerifyFull trust, rejection, outage and recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Restore and build candidate
        run: |
          dotnet restore RequestGuardMcp.slnx --locked-mode
          dotnet build RequestGuardMcp.slnx --configuration Release --no-restore --warnaserror
      - name: Qualify PostgreSQL TLS and running-backend recovery
        run: >-
          python3 tests/parity/postgres_tls_recovery.py
          --dotnet-dll src/RequestGuardMcp.Host/bin/Release/net10.0/request-guard-mcp-dotnet.dll
