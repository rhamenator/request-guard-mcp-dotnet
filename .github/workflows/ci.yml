name: CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  format:
    name: Formatting
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - run: dotnet restore RequestGuardMcp.slnx --locked-mode
      - run: dotnet format RequestGuardMcp.slnx --verify-no-changes --no-restore

  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - run: dotnet restore RequestGuardMcp.slnx --locked-mode
      - run: dotnet build RequestGuardMcp.slnx --configuration Release --no-restore --warnaserror

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - run: dotnet restore RequestGuardMcp.slnx --locked-mode
      - run: dotnet test RequestGuardMcp.slnx --configuration Release --no-restore
      - name: Historical envelope migration regressions
        run: python3 -m unittest discover -s tests/parity -p test_contract_envelopes.py
      - name: Official release-candidate gate negative controls
        run: python3 -m unittest discover -s tests/release -p 'test_*.py'
      - name: Official MCP SDK and running-build protocol contract
        run: |
          dotnet build src/RequestGuardMcp.Host/RequestGuardMcp.Host.csproj --configuration Release --no-restore
          python3 -m venv /tmp/mcp-sdk
          /tmp/mcp-sdk/bin/pip install -r tests/protocol/requirements.txt
          /tmp/mcp-sdk/bin/python tests/protocol/run.py --dotnet-dll src/RequestGuardMcp.Host/bin/Release/net10.0/request-guard-mcp-dotnet.dll
      - name: Explicit browser-origin configuration
        run: /tmp/mcp-sdk/bin/python tests/protocol/run.py --dotnet-dll src/RequestGuardMcp.Host/bin/Release/net10.0/request-guard-mcp-dotnet.dll --allowed-origin https://client.test --ws-deadline-seconds 1
      - name: Unavailable OTLP sink isolation and credential redaction
        run: /tmp/mcp-sdk/bin/python tests/protocol/run.py --dotnet-dll src/RequestGuardMcp.Host/bin/Release/net10.0/request-guard-mcp-dotnet.dll --otlp-failure
      - name: 120-second telemetry cardinality and resource endurance
        run: /tmp/mcp-sdk/bin/python tests/protocol/run.py --dotnet-dll src/RequestGuardMcp.Host/bin/Release/net10.0/request-guard-mcp-dotnet.dll --telemetry-endurance-seconds 120
      - name: Process-local stdio and official SDK
        run: /tmp/mcp-sdk/bin/python tests/stdio/run.py --dotnet-dll src/RequestGuardMcp.Host/bin/Release/net10.0/request-guard-mcp-dotnet.dll

  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - run: dotnet restore RequestGuardMcp.slnx --locked-mode
      - name: Check for known-vulnerable NuGet packages
        run: |
          set -euo pipefail
          output="$(dotnet list RequestGuardMcp.slnx package --vulnerable --include-transitive 2>&1)"
          echo "$output"
          if echo "$output" | grep -qi "has the following vulnerable packages"; then
            echo "::error::Vulnerable NuGet packages detected"
            exit 1
          fi

  parity:
    name: Rust Differential Parity
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out .NET port
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          path: request-guard-mcp-dotnet
      - name: Check out pinned Rust contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          repository: rhamenator/request-guard-mcp
          ref: 4170649920190e989175755369215d4f29a7427b
          path: request-guard-mcp
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: request-guard-mcp-dotnet/global.json
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Restore locked .NET dependencies
        run: dotnet restore RequestGuardMcp.slnx --locked-mode
        working-directory: request-guard-mcp-dotnet
      - name: Compare all contracts and disposable integrations
        run: python3 tests/parity/run.py --rust-repo "$GITHUB_WORKSPACE/request-guard-mcp" --with-integrations
        working-directory: request-guard-mcp-dotnet

  classifier-current:
    name: Current Rust Classifier (${{ matrix.revision }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        revision:
          # Published v0.1.5 and inspected current main; scoped classifier gate only.
          - f76ff9d2558fac705f091d9b858d3bc180b4f0bd
          - 2660c1fbfd71b38108dfc7b9decd309e4a8e480c
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          path: request-guard-mcp-dotnet
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          repository: rhamenator/request-guard-mcp
          ref: ${{ matrix.revision }}
          path: request-guard-mcp
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: request-guard-mcp-dotnet/global.json
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - run: dotnet restore RequestGuardMcp.slnx --locked-mode
        working-directory: request-guard-mcp-dotnet
      - name: Compare current classifier with independent expectations
        run: python3 tests/parity/classifier_current.py --rust-repo "$GITHUB_WORKSPACE/request-guard-mcp" --expected-rust-revision "${{ matrix.revision }}"
        working-directory: request-guard-mcp-dotnet
      - name: Install protocol probe dependencies
        run: |
          python3 -m venv /tmp/mcp-sdk
          /tmp/mcp-sdk/bin/pip install -r tests/protocol/requirements.txt
        working-directory: request-guard-mcp-dotnet
      - name: Qualify current Rust OTLP sink isolation and credential redaction
        run: /tmp/mcp-sdk/bin/python tests/protocol/run.py --binary "$GITHUB_WORKSPACE/request-guard-mcp/target/debug/request-guard-mcp" --otlp-failure
        working-directory: request-guard-mcp-dotnet
      - name: Qualify current Rust telemetry cardinality and resource endurance
        run: /tmp/mcp-sdk/bin/python tests/protocol/run.py --binary "$GITHUB_WORKSPACE/request-guard-mcp/target/debug/request-guard-mcp" --telemetry-endurance-seconds 120
        working-directory: request-guard-mcp-dotnet
