name: Native Bundle Qualification

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  native:
    name: Native bundle (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, rid: linux-x64}
          - {os: windows-2025, rid: win-x64}
          - {os: macos-15-intel, rid: osx-x64}
          - {os: macos-15, rid: osx-arm64}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r tests/protocol/requirements.txt
      - name: Read candidate version from source
        id: version
        shell: bash
        run: |
          version="$(python -c 'import xml.etree.ElementTree as E; print(E.parse("Directory.Build.props").findtext(".//VersionPrefix"))')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build tracked source with locked native dependencies
        run: python scripts/native_bundle.py --rid ${{ matrix.rid }} --version ${{ steps.version.outputs.version }} --output-dir out/native
      - name: Verify and run the extracted artifact
        run: python tests/protocol/qualify_bundle.py --archive out/native/request-guard-mcp-dotnet-${{ steps.version.outputs.version }}-${{ matrix.rid }}.tar.gz --expected-rid ${{ matrix.rid }} --expected-source ${{ github.sha }} --report out/native/qualification.json
      - name: Reject native dependency drift
        if: matrix.rid == 'linux-x64'
        run: python tests/protocol/lock_negative.py
      - name: Retain development candidate and exact-artifact evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-qualification-${{ matrix.rid }}
          path: out/native/
          retention-days: 7
          if-no-files-found: error

  installer:
    name: Installer (${{ matrix.rid }})
    needs: native
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, rid: linux-x64}
          - {os: windows-2025, rid: win-x64}
          - {os: macos-15-intel, rid: osx-x64}
          - {os: macos-15, rid: osx-arm64}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r tests/protocol/requirements.txt
      - name: Download the exact qualified native bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: native-qualification-${{ matrix.rid }}
          path: out/native
      - name: Install Linux package builder
        if: matrix.rid == 'linux-x64'
        run: sudo apt-get update && sudo apt-get install -y rpm
      - name: Install pinned WiX toolset
        if: matrix.rid == 'win-x64'
        run: dotnet tool install --global wix --version 5.0.2
      - name: Read candidate and synthetic prior versions
        id: version
        shell: bash
        run: |
          version="$(python -c 'import xml.etree.ElementTree as E; print(E.parse("Directory.Build.props").findtext(".//VersionPrefix"))')"
          prior="$(python -c 'import sys; a,b,c=map(int,sys.argv[1].split(".")); print(f"{a}.{b}.{c-1}" if c else (f"{a}.{b-1}.999" if b else "0.0.0"))' "$version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prior=$prior" >> "$GITHUB_OUTPUT"
      - name: Build synthetic prior-version installer from the qualified payload
        run: >-
          python scripts/native_installer.py
          --archive out/native/request-guard-mcp-dotnet-${{ steps.version.outputs.version }}-${{ matrix.rid }}.tar.gz
          --rid ${{ matrix.rid }} --bundle-version ${{ steps.version.outputs.version }}
          --package-version ${{ steps.version.outputs.prior }} --output-dir out/prior
      - name: Build candidate installer from the qualified payload
        run: >-
          python scripts/native_installer.py
          --archive out/native/request-guard-mcp-dotnet-${{ steps.version.outputs.version }}-${{ matrix.rid }}.tar.gz
          --rid ${{ matrix.rid }} --bundle-version ${{ steps.version.outputs.version }}
          --package-version ${{ steps.version.outputs.version }} --output-dir out/installers
      - name: Qualify install, launch, upgrade, uninstall and residue
        run: >-
          python tests/installers/qualify.py --installer-dir out/installers --prior-dir out/prior
          --rid ${{ matrix.rid }} --version ${{ steps.version.outputs.version }}
          --prior-version ${{ steps.version.outputs.prior }} --source ${{ github.sha }}
          --rpm-image fedora:42@sha256:99e203b80b1c3d8f7e161ec10a68fd02b081ef83a3963553e513c82846b97814
          --report out/installers/qualification.json
      - name: Retain candidate installers and lifecycle evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-qualification-${{ matrix.rid }}
          path: out/installers/
          retention-days: 7
          if-no-files-found: error
