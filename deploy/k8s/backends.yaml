apiVersion: v1
kind: Service
metadata: { name: redis, namespace: request-guard }
spec:
  selector: { app: request-guard-redis }
  ports: [{ name: redis, port: 6379, targetPort: redis }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: redis, namespace: request-guard }
spec:
  serviceName: redis
  replicas: 1
  selector: { matchLabels: { app: request-guard-redis } }
  template:
    metadata: { labels: { app: request-guard-redis } }
    spec:
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, runAsUser: 999, runAsGroup: 1000, fsGroup: 1000 }
      containers:
        - name: redis
          image: redis:8.2-alpine@sha256:30abb90e62f14b737010746def3ba99cc79fe19dcdb3d37b41f21fc62e7da19d
          command: ["sh", "-c"]
          args: ["exec redis-server --appendonly yes --requirepass \"$REDIS_PASSWORD\""]
          env:
            - name: REDIS_PASSWORD
              valueFrom: { secretKeyRef: { name: request-guard-secrets, key: REDIS_PASSWORD } }
          ports: [{ name: redis, containerPort: 6379 }]
          readinessProbe: { exec: { command: ["sh", "-c", "redis-cli -a \"$REDIS_PASSWORD\" ping | grep PONG"] }, periodSeconds: 10 }
          livenessProbe: { exec: { command: ["sh", "-c", "redis-cli -a \"$REDIS_PASSWORD\" ping | grep PONG"] }, initialDelaySeconds: 10, periodSeconds: 30 }
          resources: { requests: { cpu: 50m, memory: 64Mi }, limits: { cpu: 500m, memory: 256Mi } }
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: ["ALL"] } }
          volumeMounts: [{ name: data, mountPath: /data }]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec: { accessModes: ["ReadWriteOnce"], resources: { requests: { storage: 1Gi } } }
---
apiVersion: v1
kind: Service
metadata: { name: postgres, namespace: request-guard }
spec:
  selector: { app: request-guard-postgres }
  ports: [{ name: postgres, port: 5432, targetPort: postgres }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: postgres, namespace: request-guard }
spec:
  serviceName: postgres
  replicas: 1
  selector: { matchLabels: { app: request-guard-postgres } }
  template:
    metadata: { labels: { app: request-guard-postgres } }
    spec:
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, runAsUser: 70, runAsGroup: 70, fsGroup: 70 }
      containers:
        - name: postgres
          image: postgres:18-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
          ports: [{ name: postgres, containerPort: 5432 }]
          env:
            - { name: POSTGRES_DB, value: mcp }
            - { name: POSTGRES_USER, value: mcp }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: request-guard-secrets, key: POSTGRES_PASSWORD } }
          readinessProbe: { exec: { command: ["pg_isready", "-U", "mcp", "-d", "mcp"] }, periodSeconds: 10 }
          livenessProbe: { exec: { command: ["pg_isready", "-U", "mcp", "-d", "mcp"] }, initialDelaySeconds: 15, periodSeconds: 30 }
          resources: { requests: { cpu: 100m, memory: 128Mi }, limits: { cpu: "1", memory: 512Mi } }
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: ["ALL"] } }
          volumeMounts: [{ name: data, mountPath: /var/lib/postgresql }]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec: { accessModes: ["ReadWriteOnce"], resources: { requests: { storage: 5Gi } } }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: request-guard-backends, namespace: request-guard }
spec:
  podSelector:
    matchExpressions:
      - { key: app, operator: In, values: [request-guard-redis, request-guard-postgres] }
  policyTypes: [Ingress]
  ingress:
    - from: [{ podSelector: { matchLabels: { app: request-guard-mcp } } }]
      ports: [{ protocol: TCP, port: 6379 }, { protocol: TCP, port: 5432 }]
