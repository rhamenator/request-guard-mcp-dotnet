# Copy to secret.yaml, replace every placeholder with a high-entropy value, and do not commit it.
apiVersion: v1
kind: Secret
metadata:
  name: request-guard-secrets
  namespace: request-guard
type: Opaque
stringData:
  AUTH_TOKENS: replace_me
  CACHE_SCOPE_HMAC_KEY: replace_me_with_at_least_32_random_bytes
  POSTGRES_PASSWORD: replace_me
  REDIS_PASSWORD: replace_me
  MCP__REDIS__URL: redis://:replace_me@redis:6379
  MCP__POSTGRES__URL: Host=postgres;Port=5432;Database=mcp;Username=mcp;Password=replace_me
