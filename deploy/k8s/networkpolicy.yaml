apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: request-guard-mcp, namespace: request-guard }
spec:
  podSelector: { matchLabels: { app: request-guard-mcp } }
  policyTypes: [Ingress, Egress]
  ingress:
    - ports: [{ protocol: TCP, port: 8085 }]
  egress:
    - to: [{ namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } } }]
      ports: [{ protocol: UDP, port: 53 }, { protocol: TCP, port: 53 }]
    - to: [{ podSelector: { matchLabels: { app: request-guard-redis } } }]
      ports: [{ protocol: TCP, port: 6379 }]
    - to: [{ podSelector: { matchLabels: { app: request-guard-postgres } } }]
      ports: [{ protocol: TCP, port: 5432 }]
