apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: request-guard-mcp, namespace: request-guard }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: request-guard-mcp }
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
