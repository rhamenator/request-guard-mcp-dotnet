apiVersion: apps/v1
kind: Deployment
metadata:
  name: request-guard-mcp
  namespace: request-guard
spec:
  replicas: 2
  selector:
    matchLabels: { app: request-guard-mcp }
  template:
    metadata:
      labels: { app: request-guard-mcp }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: server
          image: ghcr.io/rhamenator/request-guard-mcp-dotnet:latest
          imagePullPolicy: IfNotPresent
          ports: [{ name: http, containerPort: 8085 }]
          envFrom:
            - configMapRef: { name: request-guard-config }
            - secretRef: { name: request-guard-secrets }
          readinessProbe: { httpGet: { path: /ready, port: http }, periodSeconds: 10, timeoutSeconds: 3 }
          livenessProbe: { httpGet: { path: /health, port: http }, periodSeconds: 20, timeoutSeconds: 3 }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: "1", memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
